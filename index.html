<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صِلْ بين العمودين: الفيروسات</title>
  <style>
    :root {
      --bg1: #fff7d6;
      --bg2: #eaf8ff;
      --panel: #ffffff;
      --primary: #6c63ff;
      --primary-dark: #4f46e5;
      --secondary: #ffb703;
      --danger: #ff5d5d;
      --success: #2ec27e;
      --success-soft: #dff9ee;
      --text: #1f2d3d;
      --muted: #6b7280;
      --border: #e9eef7;
      --shadow: 0 14px 36px rgba(36, 40, 59, 0.12);
      --card-radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Tahoma", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 22px 14px 40px;
    }

    .app {
      width: min(1200px, 100%);
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: var(--shadow);
      border-radius: 28px;
      padding: 16px 18px;
      margin-bottom: 18px;
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .title {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.3rem);
      line-height: 1.2;
      color: var(--primary-dark);
    }

    .subtitle {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .mute-btn {
      border: 0;
      background: linear-gradient(135deg, #ffe59e, #ffbf69);
      color: #4a3b00;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255, 183, 3, 0.25);
      transition: transform 0.2s ease;
      min-width: 120px;
      font-size: 0.96rem;
    }

    .mute-btn:active {
      transform: scale(0.97);
    }

    .status-bar {
      position: relative;
      margin-bottom: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border);
      padding: 14px 16px;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 10px 24px rgba(33, 48, 75, 0.06);
      font-weight: 700;
      font-size: 1.1rem;
      transition: all 0.25s ease;
    }

    .status-bar.success {
      background: var(--success-soft);
      color: #0d6b45;
      border-color: rgba(46, 194, 126, 0.3);
    }

    .status-bar.error {
      background: #fff1f1;
      color: #b82f2f;
      border-color: rgba(255, 93, 93, 0.25);
    }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: 1.15fr 1.2fr;
      gap: 20px;
      min-height: 560px;
    }

    .panel {
      background: rgba(255,255,255,0.68);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 16px;
      position: relative;
      overflow: visible;
    }

    .panel-title {
      margin: 0 0 12px;
      font-size: 1.3rem;
      color: var(--primary-dark);
      text-align: center;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    .card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 76px;
      padding: 16px 18px;
      border-radius: var(--card-radius);
      border: 2px solid transparent;
      background: #ffffff;
      box-shadow: 0 8px 18px rgba(62, 79, 120, 0.08);
      cursor: pointer;
      user-select: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.2s ease;
      text-align: center;
      font-weight: 700;
      line-height: 1.6;
      color: var(--text);
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(62, 79, 120, 0.12);
    }

    .card.selected {
      border-color: var(--secondary);
      background: #fff9e8;
      box-shadow: 0 0 0 4px rgba(255, 183, 3, 0.15);
    }

    .card.correct {
      border-color: var(--success);
      background: #ebfff5;
      color: #0b6e46;
    }

    .card.wrong {
      border-color: var(--danger);
      background: #fff0f0;
      animation: shake 0.32s linear;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-3px); }
    }

    .statement-card {
      background: linear-gradient(135deg, #f8f2ff, #fffef3);
    }

    .option-card {
      background: linear-gradient(135deg, #effbff, #f5f9ff);
    }

    .option-card.used {
      opacity: 0.7;
      filter: grayscale(0.15);
      cursor: not-allowed;
    }

    .option-card.matched {
      border-color: var(--success);
      background: #ebfff5;
    }

    .statement-label {
      display: inline-flex;
      min-width: 32px;
      height: 32px;
      padding: 0 10px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #8c7dff, #6c63ff);
      color: white;
      font-size: 0.92rem;
      font-weight: 800;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .card-content {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
    }

    .statement-card .card-content {
      justify-content: flex-start;
    }

    .statement-card .text {
      flex: 1;
      text-align: start;
    }

    .option-card .text {
      text-align: center;
    }

    .connect-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: visible;
    }

    .connect-layer svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .line {
      fill: none;
      stroke: #1fbf75;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 14 14;
      opacity: 0.95;
      filter: drop-shadow(0 4px 8px rgba(31, 191, 117, 0.25));
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 19, 31, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 18px;
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: min(480px, 92vw);
      background: linear-gradient(180deg, #ffffff, #fffaf3);
      border-radius: 30px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
      padding: 22px 20px 18px;
      text-align: center;
      border: 2px solid rgba(255,255,255,0.7);
    }

    .trophy {
      font-size: clamp(2.5rem, 5vw, 4rem);
      margin-bottom: 8px;
    }

    .modal h2 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      color: var(--primary-dark);
    }

    .scoreline {
      margin: 14px 0 10px;
      font-size: 1.05rem;
      color: var(--muted);
      font-weight: 700;
    }

    .score strong {
      color: var(--primary-dark);
      font-size: 1.2rem;
    }

    .restart-btn {
      margin-top: 14px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-weight: 800;
      font-size: 1rem;
      padding: 14px 18px;
      min-width: 180px;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(108, 99, 255, 0.3);
    }

    @media (max-width: 820px) {
      .board {
        grid-template-columns: 1fr;
      }

      .header {
        flex-wrap: wrap;
        justify-content: center;
      }

      .title-wrap {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="title-wrap">
        <h1 class="title">صِلْ بين العمودين: الفيروسات</h1>
        <p class="subtitle">اختر العبارة ثم اختر الإجابة المناسبة</p>
      </div>
      <button class="mute-btn" id="muteBtn" type="button">🔊 الصوت: مفعل</button>
    </header>

    <div class="status-bar" id="statusBar">اختر عبارة ثم اختر الإجابة المناسبة.</div>

    <div class="board">
      <div class="panel">
        <h2 class="panel-title">العمود الأول</h2>
        <div id="statementList" class="cards"></div>
      </div>

      <div class="panel">
        <h2 class="panel-title">العمود الثاني</h2>
        <div id="optionList" class="cards"></div>
      </div>

      <div class="connect-layer" aria-hidden="true">
        <svg id="svgLines" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
      </div>
    </div>
  </div>

  <div class="overlay" id="finishModal" aria-live="polite">
    <div class="modal">
      <div class="trophy">🏆🎉</div>
      <h2>أحسنتِ!</h2>
      <div class="scoreline">النتيجة النهائية: <span class="score"><strong id="finalScore">0</strong> من 5</span></div>
      <div class="scoreline">عدد الإجابات الصحيحة: <strong id="correctCount">0</strong></div>
      <button class="restart-btn" id="restartBtn" type="button">إعادة اللعب</button>
    </div>
  </div>

  <script>
    const statements = [
      { id: "s1", text: "1. من طرق تكاثر الفيروس." },
      { id: "s2", text: "2. من الأمراض الفيروسية للإنسان." },
      { id: "s3", text: "3. من المكونات الأساسية للفيروس." },
      { id: "s4", text: "4. من أشكال الفيروس." },
      { id: "s5", text: "5. العالم الذي أطلق اسم الفيروس عليه." }
    ];

    const options = [
      { id: "o1", text: "بايرنيك" },
      { id: "o2", text: "الحصبة" },
      { id: "o3", text: "الاندماجية" },
      { id: "o4", text: "الحمض النووي" },
      { id: "o5", text: "الذيلي" }
    ];

    const correctMap = {
      s1: "o3",
      s2: "o2",
      s3: "o4",
      s4: "o5",
      s5: "o1"
    };

    const state = {
      selectedStatement: null,
      matched: {}, // { s1: 'o3' }
      muted: false
    };

    const statementList = document.getElementById("statementList");
    const optionList = document.getElementById("optionList");
    const statusBar = document.getElementById("statusBar");
    const muteBtn = document.getElementById("muteBtn");
    const finishModal = document.getElementById("finishModal");
    const finalScore = document.getElementById("finalScore");
    const correctCount = document.getElementById("correctCount");
    const restartBtn = document.getElementById("restartBtn");
    const svg = document.getElementById("svgLines");

    function updateMuteButton() {
      muteBtn.textContent = state.muted ? "🔇 الصوت: مكتوم" : "🔊 الصوت: مفعل";
    }

    function setStatus(text, type = "") {
      statusBar.textContent = text;
      statusBar.classList.remove("success", "error");
      if (type) statusBar.classList.add(type);
    }

    function initialize() {
      renderStatements();
      renderOptions();
      updateLines();
      updateMuteButton();
    }

    function renderStatements() {
      statementList.innerHTML = "";
      statements.forEach((statement) => {
        const isMatched = state.matched[statement.id];
        const card = document.createElement("div");
        card.className = "card statement-card";
        if (state.selectedStatement === statement.id) card.classList.add("selected");
        if (isMatched) card.classList.add("correct");

        const inner = document.createElement("div");
        inner.className = "card-content";

        const label = document.createElement("span");
        label.className = "statement-label";
        label.textContent = statement.id.replace("s", "");

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = statement.text;

        inner.appendChild(label);
        inner.appendChild(text);
        card.appendChild(inner);

        card.addEventListener("click", () => {
          if (state.matched[statement.id]) return;
          if (state.selectedStatement === statement.id) {
            state.selectedStatement = null;
            setStatus("اختر عبارة ثم اختر الإجابة المناسبة.");
          } else {
            state.selectedStatement = statement.id;
            setStatus("تم اختيار العبارة. الآن اختر الإجابة المناسبة.");
          }
          renderStatements();
          renderOptions();
          updateLines();
        });

        statementList.appendChild(card);
      });
    }

    function renderOptions() {
      optionList.innerHTML = "";
      options.forEach((option) => {
        const matchedStatement = Object.keys(state.matched).find(
          (key) => state.matched[key] === option.id
        );
        const isUsed = !!matchedStatement;
        const card = document.createElement("div");
        card.className = "card option-card";

        if (matchedStatement) {
          card.classList.add("matched");
        }
        if (isUsed && matchedStatement !== state.selectedStatement) {
          card.classList.add("used");
        }

        if (state.selectedStatement && correctMap[state.selectedStatement] === option.id) {
          card.style.outline = "2px solid rgba(46, 194, 126, 0.35)";
        }

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = option.text;

        card.appendChild(text);

        card.addEventListener("click", () => {
          if (!state.selectedStatement) return;

          const statementId = state.selectedStatement;
          const isAlreadyUsed = Object.values(state.matched).includes(option.id);
          if (isAlreadyUsed) {
            setStatus("😥 هذه الإجابة مستخدمة بالفعل. جرّب إجابة أخرى.", "error");
            playWrong();
            state.selectedStatement = null;
            renderStatements();
            renderOptions();
            updateLines();
            return;
          }

          const isCorrect = correctMap[statementId] === option.id;

          if (isCorrect) {
            state.matched[statementId] = option.id;
            setStatus("😄 أحسنتِ! إجابة صحيحة", "success");
            playCorrect();
            state.selectedStatement = null;

            renderStatements();
            renderOptions();
            updateLines();

            if (Object.keys(state.matched).length === statements.length) {
              setTimeout(() => showFinish(), 550);
            }
          } else {
            setStatus("😥 حاولي مرة أخرى", "error");
            playWrong();
            state.selectedStatement = null;
            renderStatements();
            renderOptions();
            updateLines();
          }
        });

        optionList.appendChild(card);
      });
    }

    function updateLines() {
      svg.innerHTML = "";

      const board = document.querySelector(".board");
      const boardRect = board.getBoundingClientRect();

      Object.entries(state.matched).forEach(([statementId, optionId]) => {
        const statementEl = document.querySelector(`.statement-card:nth-child(${Number(statementId.replace("s",""))})`);
        const optionEl = Array.from(document.querySelectorAll(".option-card")).find((el, index) => {
          const optionText = options[index].id;
          return optionText === optionId;
        });

        if (!statementEl || !optionEl) return;

        const sRect = statementEl.getBoundingClientRect();
        const oRect = optionEl.getBoundingClientRect();

        const x1 = sRect.right - boardRect.left;
        const y1 = sRect.top + sRect.height / 2 - boardRect.top;

        const x2 = oRect.left - boardRect.left;
        const y2 = oRect.top + oRect.height / 2 - boardRect.top;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const midX = (x1 + x2) / 2;
        const curve = Math.max(34, Math.abs(x2 - x1) * 0.27);

        path.setAttribute(
          "d",
          `M ${x1} ${y1} C ${midX - curve} ${y1}, ${midX + curve} ${y2}, ${x2} ${y2}`
        );
        path.setAttribute("class", "line");

        svg.appendChild(path);
      });
    }

    function showFinish() {
      const correctTotal = Object.keys(state.matched).length;
      finalScore.textContent = String(statements.length);
      correctCount.textContent = String(correctTotal);
      finishModal.classList.add("show");
    }

    function hideFinish() {
      finishModal.classList.remove("show");
    }

    function resetGame() {
      state.selectedStatement = null;
      state.matched = {};
      setStatus("اختر عبارة ثم اختر الإجابة المناسبة.");
      hideFinish();
      initialize();
    }

    function createAudioContext() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      return new AudioCtx();
    }

    let audioCtx = null;
    function ensureAudioContext() {
      if (!audioCtx) audioCtx = createAudioContext();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playCorrect() {
      if (state.muted) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;

      const oscillator = ctx.createOscillator();
      const gainNode = ctx.createGain();

      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(640, ctx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(920, ctx.currentTime + 0.18);

      gainNode.gain.setValueAtTime(0.0001, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28);

      oscillator.connect(gainNode);
      gainNode.connect(ctx.destination);

      oscillator.start();
      oscillator.stop(ctx.currentTime + 0.3);
    }

    function playWrong() {
      if (state.muted) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;

      const oscillator = ctx.createOscillator();
      const gainNode = ctx.createGain();

      oscillator.type = "sawtooth";
      oscillator.frequency.setValueAtTime(200, ctx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.12);

      gainNode.gain.setValueAtTime(0.0001, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.1, ctx.currentTime + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);

      oscillator.connect(gainNode);
      gainNode.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + 0.18);
    }

    muteBtn.addEventListener("click", () => {
      state.muted = !state.muted;
      updateMuteButton();
    });

    restartBtn.addEventListener("click", () => {
      resetGame();
    });

    window.addEventListener("resize", updateLines);

    initialize();
  </script>
</body>
</html>
